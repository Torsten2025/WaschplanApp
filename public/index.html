<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waschmaschinen-Buchungsapp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/senior.css">
    <script src="js/logger.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/monitoring.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <!-- Skip-Link für Keyboard-Navigation -->
    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>
    <div class="container">
        <header>
            <h1>GBMZ - Waschmaschinen-Buchungsapp</h1>
            <nav class="main-nav">
                <a href="/" class="main-nav-link">Buchungen</a>
                <a href="/admin.html" class="main-nav-link">Admin</a>
                <a href="/monitoring.html" class="main-nav-link">Monitoring</a>
            </nav>
            <div class="header-actions">
                <div id="user-info" class="user-info hidden">
                    <span id="username-display" class="username-display"></span>
                    <button id="logout-btn" class="logout-btn" aria-label="Abmelden" title="Abmelden">Abmelden</button>
                </div>
                <button id="login-btn" class="login-btn" aria-label="Anmelden" title="Anmelden">Anmelden</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Theme wechseln" title="Dark Mode umschalten">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <main id="main-content" tabindex="-1">
            <!-- Navigation für Woche -->
            <section class="navigation-section" id="navigation-section" aria-label="Navigation">
                <div class="nav-controls">
                    <button id="nav-prev" class="nav-btn" aria-label="Vorherige Woche">
                        <span>←</span>
                    </button>
                    <div id="nav-display" class="nav-display" aria-live="polite"></div>
                    <button id="nav-next" class="nav-btn" aria-label="Nächste Woche">
                        <span>→</span>
                    </button>
                </div>
            </section>

            <!-- Bereich für Meldungen/Fehler -->
            <section class="messages-section">
                <div id="messages"></div>
            </section>

            <!-- Bereich für Wochenübersicht (zettel-ähnliches Design) -->
            <section class="week-view-section" id="week-view-section" aria-label="Arbeitswochenübersicht">
                <div id="week-container" role="region" aria-label="Buchungen für die Arbeitswoche">
                    <!-- Struktur wird dynamisch generiert -->
                    <!-- Bereich 1: Waschmaschinen -->
                    <section class="schedule-section">
                        <h2 class="section-title">Waschmaschinen</h2>
                        <div class="table-wrapper">
                            <table id="week-grid-washers" class="schedule-table" role="table" aria-label="Waschmaschinen">
                                <!-- Tabelle wird dynamisch generiert -->
                            </table>
                        </div>
                    </section>
                    <!-- Bereich 2: Trockenräume -->
                    <section class="schedule-section">
                        <h2 class="section-title">Trockenräume</h2>
                        <div class="table-wrapper">
                            <table id="week-grid-dryers" class="schedule-table" role="table" aria-label="Trockenräume">
                                <!-- Tabelle wird dynamisch generiert -->
                            </table>
                        </div>
                    </section>
                    <!-- Bereich 3: Tumbler -->
                    <section class="schedule-section">
                        <h2 class="section-title">Tumbler</h2>
                        <div class="table-wrapper">
                            <table id="week-grid-tumblers" class="schedule-table" role="table" aria-label="Tumbler">
                                <!-- Tabelle wird dynamisch generiert -->
                            </table>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal für Bestätigungs-Dialoge -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <h2 id="modal-title" class="modal-title"></h2>
            <p id="modal-message" class="modal-message"></p>
            <div class="modal-actions">
                <button id="modal-confirm" class="modal-btn modal-btn-primary" aria-label="Bestätigen"></button>
                <button id="modal-cancel" class="modal-btn modal-btn-secondary" aria-label="Abbrechen">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Login-Modal -->
    <div id="login-modal" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-hidden="true">
        <div class="login-modal-content">
            <h2 id="login-title" class="login-title">Anmelden</h2>
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="login-username">Benutzername:</label>
                    <input type="text" id="login-username" required aria-required="true" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="login-password">Passwort:</label>
                    <input type="password" id="login-password" required aria-required="true" autocomplete="current-password">
                </div>
                <div class="login-actions">
                    <button type="submit" class="modal-btn modal-btn-primary">Anmelden</button>
                    <button type="button" id="show-register" class="modal-btn modal-btn-secondary">Registrieren</button>
                    <button type="button" id="close-login" class="modal-btn modal-btn-secondary">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Register-Modal -->
    <div id="register-modal" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="register-title" aria-hidden="true">
        <div class="login-modal-content">
            <h2 id="register-title" class="login-title">Registrieren</h2>
            <form id="register-form" class="login-form">
                <div class="input-group">
                    <label for="register-username">Benutzername:</label>
                    <input type="text" id="register-username" required aria-required="true" autocomplete="username" minlength="3" maxlength="50">
                    <small>Mindestens 3 Zeichen</small>
                </div>
                <div class="input-group">
                    <label for="register-password">Passwort:</label>
                    <input type="password" id="register-password" required aria-required="true" autocomplete="new-password" minlength="6">
                    <small>Mindestens 6 Zeichen</small>
                </div>
                <div class="login-actions">
                    <button type="submit" class="modal-btn modal-btn-primary">Registrieren</button>
                    <button type="button" id="show-login" class="modal-btn modal-btn-secondary">Anmelden</button>
                    <button type="button" id="close-register" class="modal-btn modal-btn-secondary">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast-Notification-Container -->
    <div id="toast-container" class="toast-container" role="region" aria-live="polite" aria-label="Benachrichtigungen"></div>
</body>
</html>
